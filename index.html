<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Agenda de cobranças: controle vencimentos, recebimentos e inadimplência em um calendário simples." />
  <meta name="theme-color" content="#0f172a" />
  <title>Agenda de Cobranças</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">📅</span>
      <div>
        <h1>Agenda de Cobranças</h1>
        <p class="topbar__sub">Controle de vencimentos e recebimentos</p>
      </div>
    </div>

    <div class="topbar__actions">
      <button id="btn-tema" class="btn btn--ghost" type="button" title="Alternar tema">
        <span id="btn-tema-icone">🌙</span>
      </button>
      <div class="menu">
        <button id="btn-dados" class="btn btn--ghost" type="button" aria-haspopup="true" aria-expanded="false">
          Dados ▾
        </button>
        <div id="menu-dados" class="menu__lista" hidden>
          <button type="button" data-acao="exportar-json">Exportar backup (.json)</button>
          <button type="button" data-acao="exportar-csv">Exportar planilha (.csv)</button>
          <button type="button" data-acao="importar">Importar backup (.json)</button>
          <button type="button" data-acao="limpar" class="menu__perigo">Apagar tudo</button>
        </div>
      </div>
      <button id="btn-nova" class="btn btn--primario" type="button">+ Nova cobrança</button>
    </div>
  </header>

  <main class="conteudo">
    <!-- Indicadores -->
    <section class="kpis" aria-label="Resumo do mês">
      <article class="kpi">
        <span class="kpi__rotulo">A receber no mês</span>
        <strong class="kpi__valor" id="kpi-receber">R$ 0,00</strong>
        <span class="kpi__detalhe" id="kpi-receber-qtd">0 cobranças</span>
      </article>
      <article class="kpi kpi--ok">
        <span class="kpi__rotulo">Recebido no mês</span>
        <strong class="kpi__valor" id="kpi-recebido">R$ 0,00</strong>
        <span class="kpi__detalhe" id="kpi-recebido-qtd">0 cobranças</span>
      </article>
      <article class="kpi kpi--alerta">
        <span class="kpi__rotulo">Em atraso (total)</span>
        <strong class="kpi__valor" id="kpi-atrasado">R$ 0,00</strong>
        <span class="kpi__detalhe" id="kpi-atrasado-qtd">0 cobranças</span>
      </article>
      <article class="kpi kpi--info">
        <span class="kpi__rotulo">Vence em 7 dias</span>
        <strong class="kpi__valor" id="kpi-proximas">R$ 0,00</strong>
        <span class="kpi__detalhe" id="kpi-proximas-qtd">0 cobranças</span>
      </article>
    </section>

    <!-- Barra de navegação do mês + filtros -->
    <section class="barra">
      <div class="barra__mes">
        <button id="mes-anterior" class="btn btn--icone" type="button" aria-label="Mês anterior">‹</button>
        <h2 id="mes-titulo">—</h2>
        <button id="mes-proximo" class="btn btn--icone" type="button" aria-label="Próximo mês">›</button>
        <button id="mes-hoje" class="btn btn--ghost btn--pequeno" type="button">Hoje</button>
      </div>

      <div class="barra__filtros">
        <input id="filtro-busca" class="campo" type="search" placeholder="Buscar cliente ou descrição…" />
        <select id="filtro-status" class="campo">
          <option value="todos">Todos os status</option>
          <option value="pendente">Pendentes</option>
          <option value="atrasado">Atrasadas</option>
          <option value="pago">Pagas</option>
          <option value="cancelado">Canceladas</option>
        </select>
        <div class="abas" role="tablist">
          <button class="aba is-ativa" data-visao="calendario" role="tab" type="button">Calendário</button>
          <button class="aba" data-visao="lista" role="tab" type="button">Lista</button>
        </div>
      </div>
    </section>

    <!-- Calendário -->
    <section id="visao-calendario" class="painel">
      <div class="calendario__semana" aria-hidden="true">
        <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
      </div>
      <div id="calendario" class="calendario"></div>
      <div class="legenda">
        <span><i class="ponto ponto--pendente"></i> Pendente</span>
        <span><i class="ponto ponto--atrasado"></i> Atrasada</span>
        <span><i class="ponto ponto--pago"></i> Paga</span>
        <span><i class="ponto ponto--cancelado"></i> Cancelada</span>
      </div>
    </section>

    <!-- Lista -->
    <section id="visao-lista" class="painel" hidden>
      <div id="filtro-dia-aviso" class="aviso" hidden>
        <span id="filtro-dia-texto"></span>
        <button type="button" id="filtro-dia-limpar" class="btn btn--pequeno btn--ghost">Limpar filtro</button>
      </div>
      <div id="lista" class="lista"></div>
    </section>
  </main>

  <!-- Modal de cadastro/edição -->
  <div id="modal" class="modal" hidden>
    <div class="modal__fundo" data-fechar></div>
    <div class="modal__caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <header class="modal__topo">
        <h3 id="modal-titulo">Nova cobrança</h3>
        <button type="button" class="btn btn--icone" data-fechar aria-label="Fechar">×</button>
      </header>

      <form id="form-cobranca" class="form" novalidate>
        <input type="hidden" id="f-id" />

        <div class="form__linha">
          <label class="form__campo">
            <span>Cliente *</span>
            <input id="f-cliente" class="campo" type="text" required maxlength="80" placeholder="Ex.: Maria Souza" />
          </label>
          <label class="form__campo">
            <span>WhatsApp</span>
            <input id="f-telefone" class="campo" type="tel" maxlength="20" placeholder="(11) 98888-7777" />
          </label>
        </div>

        <label class="form__campo">
          <span>Descrição</span>
          <input id="f-descricao" class="campo" type="text" maxlength="120" placeholder="Ex.: Mensalidade de agosto" />
        </label>

        <div class="form__linha">
          <label class="form__campo">
            <span>Valor (R$) *</span>
            <input id="f-valor" class="campo" type="number" step="0.01" min="0" required placeholder="0,00" />
          </label>
          <label class="form__campo">
            <span>Vencimento *</span>
            <input id="f-vencimento" class="campo" type="date" required />
          </label>
          <label class="form__campo">
            <span>Status</span>
            <select id="f-status" class="campo">
              <option value="pendente">Pendente</option>
              <option value="pago">Paga</option>
              <option value="cancelado">Cancelada</option>
            </select>
          </label>
        </div>

        <div class="form__linha" id="bloco-recorrencia">
          <label class="form__campo">
            <span>Repetir</span>
            <select id="f-recorrencia" class="campo">
              <option value="nenhuma">Não repetir</option>
              <option value="semanal">Toda semana</option>
              <option value="quinzenal">A cada 15 dias</option>
              <option value="mensal">Todo mês</option>
              <option value="anual">Todo ano</option>
            </select>
          </label>
          <label class="form__campo">
            <span>Quantidade de parcelas</span>
            <input id="f-parcelas" class="campo" type="number" min="1" max="60" value="1" />
          </label>
        </div>

        <label class="form__campo">
          <span>Observações</span>
          <textarea id="f-obs" class="campo" rows="2" maxlength="300" placeholder="Anotações internas…"></textarea>
        </label>

        <p id="form-erro" class="form__erro" hidden></p>

        <footer class="modal__rodape">
          <button type="button" class="btn btn--ghost" data-fechar>Cancelar</button>
          <button type="submit" class="btn btn--primario">Salvar</button>
        </footer>
      </form>
    </div>
  </div>

  <input type="file" id="input-arquivo" accept="application/json,.json" hidden />
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
